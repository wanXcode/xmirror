<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex, follow"><title>投诉与删除申请 | XPut</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/theme.css"><style>body{background:var(--xp-bg);color:var(--xp-text);font-family:system-ui}main{max-width:660px;margin:40px auto;padding:24px;line-height:1.8}label{display:block;margin:18px 0}input,textarea,select,button{box-sizing:border-box;font:inherit;max-width:100%;padding:10px;border:1px solid var(--xp-line);border-radius:6px;background:var(--xp-paper);color:inherit}input,textarea{display:block;width:100%}button{cursor:pointer}a{color:var(--xp-blue)}.trap{display:none}</style></head><body><main><a href="/">← 返回 XPut</a><h1>投诉与删除申请</h1><p>如果存档涉及你的版权、隐私或其他权益，请在这里说明。管理员会核实并处理；提交申请不会自动删除内容。</p><form id="reportForm"><label>XPut 存档链接<input name="url" required maxlength="300" placeholder="https://xput.app/Ab1234"></label><label>申请类型<select name="kind"><option value="copyright">版权</option><option value="privacy">个人信息／隐私</option><option value="other">其他／删除申请</option></select></label><label>说明<textarea name="reason" required minlength="10" maxlength="2000" rows="6" placeholder="请说明涉及的内容、你的关系及希望采取的处理方式。"></textarea></label><label>联系邮箱（可选）<input name="contact" type="email" maxlength="254" autocomplete="email"></label><label class="trap" aria-hidden="true">Website<input name="website" tabindex="-1" autocomplete="off"></label><p>申请说明和联系方式仅供管理员处理，不会公开展示。请勿提交密码、证件号码或其他无关的敏感信息。</p><button type="submit">提交申请</button><p id="reportStatus" role="status" aria-live="polite"></p></form></main><script src="/report.js" defer></script></body></html>
