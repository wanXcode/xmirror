<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XPut 内容管理</title>
<link rel="icon" href="/favicon.ico?v=xput-tray-1" sizes="16x16 32x32 48x48">
<link rel="icon" href="/favicon.svg?v=xput-tray-1" type="image/svg+xml" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=xput-tray-1">
<link rel="mask-icon" href="/safari-pinned-tab.svg?v=xput-tray-1" color="#2563eb">
<link rel="manifest" href="/site.webmanifest?v=xput-tray-1">
  <meta name="robots" content="noindex, follow">
  <style>
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;margin:0;background:#0f172a;color:#e2e8f0}
    .wrap{max-width:1100px;margin:0 auto;padding:24px}
    .card{background:#111827;border:1px solid #334155;border-radius:16px;padding:20px;margin-bottom:16px}
    h1,h2{margin:0 0 12px}
    .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
    input,button,select,textarea{border-radius:10px;border:1px solid #475569;padding:10px 12px;font-size:14px}
    input,textarea{background:#0b1220;color:#fff}
    input{min-width:280px}
    textarea{width:100%;min-height:90px;resize:vertical}
    button{background:#2563eb;color:#fff;cursor:pointer}
    button.secondary{background:#334155}
    button.ghost{background:#0b1220;border:1px solid #334155}
    .status-on{color:#22c55e;font-weight:700}.status-off{color:#f59e0b;font-weight:700}
    .muted{color:#94a3b8;font-size:13px}
    table{width:100%;border-collapse:collapse;font-size:13px}
    th,td{border-top:1px solid #334155;padding:10px 8px;text-align:left;vertical-align:top}
    th{color:#cbd5e1}
    code{background:#0b1220;padding:2px 6px;border-radius:6px;word-break:break-all}
    .pill{display:inline-block;padding:2px 8px;border-radius:999px;background:#1e293b;margin-right:6px;margin-bottom:4px}
    .ok{color:#22c55e}.reject{color:#f87171}
    .url{max-width:280px;word-break:break-all}
    .tools{display:flex;gap:8px;flex-wrap:wrap}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>XPut 内容管理</h1>
      <div class="row">
        <input id="token" type="password" placeholder="输入 MODERATION_ADMIN_TOKEN" />
        <button onclick="saveTokenAndReload()">连接后台</button>
        <button class="ghost" onclick="toggleTokenVisibility()">显示 / 隐藏 token</button>
        <button class="ghost" onclick="copyToken()">复制 token</button>
        <button class="secondary" onclick="clearToken()">清空</button>
        <button class="secondary" onclick="refreshAll()">刷新</button>
      </div>
      <p class="muted">内容审核、存档删除、投诉处理和搜索收录在此统一管理。</p>
      <div id="flash" class="muted"></div>
    </div>

    <div class="card">
      <h2>审核开关</h2>
      <div class="row">
        <div>当前状态：<span id="enabledState">-</span></div>
        <button onclick="toggleModeration(true)">开启审核</button>
        <button class="secondary" onclick="toggleModeration(false)">关闭审核</button>
      </div>
      <p id="updatedAt" class="muted"></p>
    </div>

    <div class="card">
      <div class="row" style="justify-content:space-between">
        <h2>最近审核结果（按文章合并）</h2>
        <div class="tools">
          <select id="actionFilter" onchange="loadLogs()">
            <option value="">全部</option>
            <option value="review">只看待复核</option>
            <option value="reject">只看拒绝</option>
            <option value="allow">只看通过</option>
          </select>
          <select id="limit" onchange="loadLogs()">
            <option value="20">20</option>
            <option value="50" selected>50</option>
            <option value="100">100</option>
          </select>
        </div>
      </div>
      <table>
        <thead>
          <tr><th>时间</th><th>动作</th><th>阶段</th><th>作者</th><th>URL</th><th>命中 / 证据</th><th>操作</th></tr>
        </thead>
        <tbody id="logsBody"></tbody>
      </table>
    </div>

    <div class="card">
      <h2>存档与搜索收录</h2><p id="seoSummary" class="muted"></p>
      <p class="muted">自动评估不保证 Google 收录。封禁优先于人工推荐；恢复自动后重新计算。</p>
      <select id="seoFilter" onchange="seoPage=1;loadSeo()"><option value="all">全部存档</option><option value="unchecked">尚未评估</option><option value="failed">评估失败</option><option value="review">待复核</option><option value="index">可推荐</option><option value="noindex">不推荐</option></select>
      <button onclick="loadSeo()">刷新收录状态</button>
      <div id="seoRows"></div><button id="seoPrev" onclick="seoPage--;loadSeo()">上一页</button><span id="seoPage"></span><button id="seoNext" onclick="seoPage++;loadSeo()">下一页</button>
    </div>
    <div class="card"><h2>投诉与删除申请</h2>
      <select id="reportFilter" onchange="reportPage=1;loadReports()"><option value="open">待处理</option><option value="closed">已处理</option></select>
      <button onclick="loadReports()">刷新申请</button><div id="reportRows"></div>
      <button id="reportPrev" onclick="reportPage--;loadReports()">上一页</button><span id="reportPage"></span><button id="reportNext" onclick="reportPage++;loadReports()">下一页</button>
    </div>
    <div class="card">
      <h2>选中日志详情</h2>
      <textarea id="detailBox" readonly placeholder="点上面的某一行，这里会显示完整 URL、分数、命中规则和原始记录。"></textarea>
    </div>
  </div>
  <section class="wrap" id="reviewPanel" hidden>
    <div class="card"><h2>审核正文</h2><p id="reviewReason"></p>
    <a id="reviewLink" target="_blank" rel="noopener noreferrer">查看原文和媒体</a>
    <pre id="reviewText" style="white-space:pre-wrap;max-height:420px;overflow:auto"></pre>
    <textarea id="reviewNote" maxlength="500" placeholder="填写审核理由（必填）"></textarea>
    <button onclick="decideReview('allow')">人工通过</button>
    <button onclick="decideReview('reject')">维持拒绝</button>
    <button onclick="decideReview('reset')">撤销人工决定</button>
    </div>
  </section>
  <script>
    const tokenInput = document.getElementById('token');
    tokenInput.value = localStorage.getItem('xmirror_admin_token') || '';
    let currentLogs = [];

    function getToken(){ return tokenInput.value.trim(); }
    function setFlash(msg, isError=false){ const el=document.getElementById('flash'); el.textContent=msg||''; el.style.color=isError?'#fca5a5':'#94a3b8'; }
    function authHeaders(){ return { 'Content-Type':'application/json', 'x-admin-token': getToken() }; }
    function saveTokenAndReload(){ localStorage.setItem('xmirror_admin_token', getToken()); refreshAll(); }
    function clearToken(){ tokenInput.value=''; localStorage.removeItem('xmirror_admin_token'); setFlash('已清空本地 token'); }
    function toggleTokenVisibility(){ tokenInput.type = tokenInput.type === 'password' ? 'text' : 'password'; }
    async function copyToken(){ try { await navigator.clipboard.writeText(getToken()); setFlash('token 已复制'); } catch(e){ setFlash('复制失败：' + e.message, true); } }
    async function api(url, options={}){
      const res = await fetch(url, { ...options, headers: { ...(options.headers||{}), ...authHeaders() } });
      const data = await res.json().catch(()=>({ error:'响应解析失败' }));
      if(!res.ok) throw new Error(data.error || '请求失败');
      return data;
    }
    async function loadSettings(){
      const data = await api('/api/admin/moderation/settings');
      const enabled = !!data.settings.enabled;
      document.getElementById('enabledState').textContent = enabled ? '开启' : '关闭';
      document.getElementById('enabledState').className = enabled ? 'status-on' : 'status-off';
      document.getElementById('updatedAt').textContent = '最近更新时间：' + (data.settings.updated_at || '-');
    }
    async function toggleModeration(enabled){
      try {
        await api('/api/admin/moderation/settings', { method:'POST', body: JSON.stringify({ enabled }) });
        setFlash('审核开关已更新');
        await loadSettings();
      } catch (e) { setFlash(e.message, true); }
    }
    function escapeText(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
    function renderMatched(matched=[]){
      if(!matched.length) return '<span class="muted">-</span>';
      return matched.map(item => `<span class="pill">${escapeText(item.type)}: ${escapeText(item.value || item.label || '')}${item.score?` (+${escapeText(item.score)})`:''}${item.evidence?` · ${escapeText(item.evidence)}`:''}</span>`).join('');
    }
    function showDetails(index){
      const log = currentLogs[index];
      if(!log) return;
      document.getElementById('detailBox').value = JSON.stringify(log, null, 2);
    }
    async function loadLogs(){
      try {
        const limit = document.getElementById('limit').value;
        const action = document.getElementById('actionFilter').value;
        const qs = new URLSearchParams({ limit });
        if (action) qs.set('action', action);
        const data = await api('/api/admin/moderation/logs?' + qs.toString());
        currentLogs = data.logs || [];
        const rows = currentLogs.map((log, index) => `
          <tr onclick="showDetails(${index})" style="cursor:pointer">
            <td>${escapeText(log.ts || '-')}</td>
            <td class="${log.action === 'reject' ? 'reject' : 'ok'}">${escapeText(({allow:'通过',reject:'拒绝',review:'待复核'})[log.action] || log.action)}<br><small>规则 ${escapeText(log.ruleVersion || '历史版本未知')}</small></td>
            <td>${escapeText(log.stage || '-')}<br>${escapeText(log.category || '')}</td>
            <td><code>${escapeText(log.authorHandle || log.handle || '-')}</code></td>
            <td class="url">${escapeText(log.url || '-')}</td>
            <td>${renderMatched(log.matched || [])}<br>${escapeText(log.evidence || log.reason || '')}</td>
            <td><button onclick="event.stopPropagation();recheckLog(${index})">重新审核</button>
            ${log.reviewId ? `<button onclick="event.stopPropagation();reviewLog(${index})">查看正文并处理</button>` : ''}</td>
          </tr>
        `).join('');
        document.getElementById('logsBody').innerHTML = rows || '<tr><td colspan="7" class="muted">暂无日志</td></tr>';
        document.getElementById('detailBox').value = currentLogs.length ? JSON.stringify(currentLogs[0], null, 2) : '';
      } catch (e) { setFlash(e.message, true); }
    }
    async function recheckLog(index){
      try { setFlash('正在获取原文并重新审核…'); await api('/api/admin/moderation/recheck', {method:'POST',body:JSON.stringify({url:currentLogs[index].url})}); await loadLogs(); setFlash('重新审核完成，结果已更新；不会自动创建存档。'); }
      catch(e){setFlash(e.message,true);}
    }
    async function reviewLog(index){
      try {
        const {record}=await api('/api/admin/moderation/reviews/'+currentLogs[index].reviewId);
        document.getElementById('reviewText').textContent=record.payload.content;
        document.getElementById('reviewReason').textContent=record.reason || '请核对正文和来源。此决定只适用于此正文版本；未审核图片和视频。';
        document.getElementById('reviewLink').href=record.payload.url;
        document.getElementById('reviewNote').value='';
        document.getElementById('reviewPanel').dataset.id=record.id;
        document.getElementById('reviewPanel').hidden=false;
      } catch(e){setFlash(e.message,true);}
    }
    async function decideReview(action){
      const panel=document.getElementById('reviewPanel');
      try { const result=await api('/api/admin/moderation/reviews/'+panel.dataset.id,{method:'POST',body:JSON.stringify({action,note:document.getElementById('reviewNote').value})}); panel.hidden=true; await loadLogs(); await loadSeo(); setFlash(result.pending?'决定已保存，搜索状态待同步，后台将自动重试。':'决定已保存，已有存档的搜索状态已同步；尚未存档的内容仍需提交保存。'); }
      catch(e){setFlash(e.message,true);}
    }
    let seoPage=1, reportPage=1;
    const seoNames={index:'允许搜索引擎收录',review:'等待检查',noindex:'暂不推荐收录'};
    const reasonNames={repeated_content:'重复正文较多',repetitive_special_format:'特殊格式存在重复',moderation_unknown:'等待有效审核',moderation_reject:'内容审核拒绝',admin_block:'管理员封禁',duplicate:'重复存档',short_text:'正文较短',empty_text:'正文为空',incomplete_metadata:'作者或时间缺失',essential_media_pending:'媒体尚未就绪',manual_index:'人工推荐',manual_noindex:'人工撤回',insufficient_quality_signals:'有效信息不足',automatic_indexing_paused:'自动推荐已暂停',substantial_text:'正文充足',informative_text:'有一定正文',source_heading:'原文标题',preserved_media:'已保存媒体',complete_metadata:'来源信息完整',readable_structure:'有段落结构',invalid_source_or_short_code:'来源或短码无效'};
    async function loadSeo(){
      try {
        const data = await api('/api/admin/seo?status=' + document.getElementById('seoFilter').value + '&page=' + seoPage);
        document.getElementById('seoSummary').textContent = data.summary.map(s=>(seoNames[s.status]||s.status)+' '+s.count).join(' · ') + ' · 尚未评估 '+(data.pending.unchecked||0)+' · 失败 '+(data.pending.failed||0) + (data.ai ? ` · AI ${data.ai.enabled&&!data.ai.paused?'启用':'使用原文兜底'} · 今日已预留 ¥${data.ai.day.reservedCny.toFixed(4)} / ${data.ai.dailyLimit} · 本月 ¥${data.ai.month.reservedCny.toFixed(4)} / ${data.ai.monthlyLimit}` : '') + '（允许收录不代表 Google 已收录）';
        document.getElementById('seoPrev').disabled = seoPage<=1;
        document.getElementById('seoNext').disabled = !data.hasMore;
        document.getElementById('seoPage').textContent = ' 第 '+seoPage+' 页 ';
        const root = document.getElementById('seoRows'); root.replaceChildren();
        for(const post of data.posts){
          const row = document.createElement('p');
          const label = document.createElement('span');
          const reasons=JSON.parse(post.seo_reason||'[]').map(r=>reasonNames[r]||r).join('、');
          label.textContent = `${post.id} · ${post.short_code} · 内容审核：${({allow:'允许发布',reject:'拒绝发布',review:'等待审核',unknown:'等待审核'})[post.seo_moderation]||'尚未评估'} · ${seoNames[post.seo_status]||post.seo_status} · ${reasons} · 标题：${({ai:'AI生成',original:'原文标题',extracted:'自动提取'})[post.titleSource]}${post.titleJob?.error?'（已自动兜底）':''} `;
          row.appendChild(label);
          const link=document.createElement('a');link.href='/'+post.short_code;link.target='_blank';link.rel='noopener';link.textContent=post.title;row.appendChild(link);
          for(const [text, override, blocked] of [['自动', null, undefined], ['推荐', 'index', undefined], ['不推荐', 'noindex', undefined], ['封禁', null, true], ['解除封禁', null, false]]){
            const button = document.createElement('button'); button.textContent = text;
            button.onclick = async () => {
              button.disabled = true;
              try { await api('/api/admin/seo/' + post.id, { method:'POST', body:JSON.stringify({override, blocked}) }); await loadSeo(); }
              catch(e){ setFlash(e.message, true); } finally { button.disabled = false; }
            };
            row.appendChild(button);
          }
          const remove=document.createElement('button');remove.textContent='删除存档';remove.onclick=()=>deleteArchive(post.id);row.appendChild(remove);
          root.appendChild(row);
        }
        if(!data.posts.length) root.textContent = '暂无记录';
      } catch(e){ setFlash(e.message, true); }
    }
    async function deleteArchive(id,reportId){
      if(!confirm('删除后公开链接将返回 404，且媒体文件会移除。确定删除这条存档？'))return;
      try {
        await api('/api/delete',{method:'POST',body:JSON.stringify({id})});
        if(reportId)await api('/api/admin/reports/'+reportId,{method:'POST',body:JSON.stringify({action:'close'})});
        await Promise.all([loadSeo(),loadReports()]);setFlash('存档已删除');
      }catch(e){setFlash(e.message,true);}
    }
    async function loadReports(){
      try{
        const data=await api('/api/admin/reports?status='+document.getElementById('reportFilter').value+'&page='+reportPage);
        const root=document.getElementById('reportRows');root.replaceChildren();
        document.getElementById('reportPrev').disabled=reportPage<=1;
        document.getElementById('reportNext').disabled=!data.hasMore;
        document.getElementById('reportPage').textContent=' 第 '+reportPage+' 页 ';
        for(const report of data.reports){
          const row=document.createElement('section');row.style.cssText='padding:16px 0;border-bottom:1px solid #334155;overflow-wrap:anywhere';
          const info=document.createElement('p');info.textContent='#'+report.id+' · '+report.kind+' · '+report.created_at+' · '+(report.contact||'未留联系方式');
          const link=document.createElement('a');link.href='/'+report.short_code;link.target='_blank';link.rel='noopener';link.textContent=report.short_code;
          const reason=document.createElement('p');reason.textContent=report.reason;reason.style.whiteSpace='pre-wrap';
          row.append(info,link,reason);
          for(const [label,action] of [['禁止搜索收录并结案','block'],['已处理／无需操作，结案','close']]){
            const b=document.createElement('button');b.textContent=label;b.onclick=async()=>{b.disabled=true;try{await api('/api/admin/reports/'+report.id,{method:'POST',body:JSON.stringify({action})});await Promise.all([loadReports(),loadSeo()]);}catch(e){setFlash(e.message,true);}finally{b.disabled=false;}};row.append(b);
          }
          const remove=document.createElement('button');remove.textContent='删除存档并结案';remove.onclick=()=>deleteArchive(report.post_id,report.id);row.append(remove);root.append(row);
        }
        if(!data.reports.length)root.textContent='暂无申请';
      }catch(e){setFlash(e.message,true);}
    }
    async function refreshAll(){
      localStorage.setItem('xmirror_admin_token', getToken());
      try {
        await loadSettings();
        await loadLogs();
        await loadSeo();
        await loadReports();
        setFlash('后台已连接');
      } catch (e) { setFlash(e.message, true); }
    }
    refreshAll();
  </script>
</body>
</html>
