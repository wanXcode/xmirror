  <script defer data-domain="xmirror.app" src="https://a.zhxs.me/js/script.js"></script>

<body class="home-page">
  <div class="page-shell">
    <nav class="page-tools" aria-label="页面设置">
      <button class="quiet-button" type="button" onclick="toggleHomeTheme()" aria-label="切换主题" id="themeButton">◐</button>
      <button class="quiet-button" type="button" onclick="toggleLanguage()" id="lang-btn">EN</button>
    </nav>
    <main>
      <header class="header">
        <a class="brand" href="/" aria-label="XPut 首页"><span class="brand-mark" aria-hidden="true">X</span><h1>XPut</h1></a>
        <p class="subtitle">粘贴 X 链接，生成可访问的镜像页面</p>
      </header>
      <section class="archive-section" aria-label="生成存档">
        <form id="archiveForm" novalidate>
          <div class="input-group">
            <label for="url">X 链接</label>
            <input type="url" id="url" placeholder="https://x.com/username/status/1234567890" autocomplete="off" autocapitalize="none" spellcheck="false" aria-describedby="result" required>
          </div>
          <button class="primary-button" id="submit" type="submit">生成镜像</button>
        </form>
        <div class="loading" id="loading" role="status" hidden><span class="spinner" aria-hidden="true"></span><p>正在抓取内容…</p></div>
        <div class="result" id="result" role="status" aria-live="polite" aria-atomic="true" hidden></div>
      </section>
      <aside class="shortcut-card">
        <div class="shortcut-copy">
          <div class="title">iPhone 一键存档快捷指令</div>
          <div class="desc">复制 X 链接后，一键生成 XPut 存档链接</div>
        </div>
        <a class="shortcut-link" href="https://www.icloud.com/shortcuts/2fdd008bff274ce382cc66dacaf3b566" target="_blank" rel="noopener noreferrer">立即安装 ↗</a>
      </aside>
      <section class="history" id="history" aria-label="存档记录">
        <div class="history-tabs" role="tablist" aria-label="存档记录">
          <button id="localTab" role="tab" type="button" aria-controls="localPanel" aria-selected="false" tabindex="-1" onclick="switchHistory('local')">本机记录</button>
          <button id="publicTab" role="tab" type="button" aria-controls="publicPanel" aria-selected="true" onclick="switchHistory('public')">最新公开存档</button>
        </div>
        <div id="localPanel" role="tabpanel" aria-labelledby="localTab" tabindex="0" hidden>
          <p class="history-note" id="localHistoryNote">仅保存在当前浏览器</p>
          <div id="localHistoryList"></div>
        </div>
        <div id="publicPanel" role="tabpanel" aria-labelledby="publicTab" tabindex="0">
          <div id="historyList"></div>
          <div class="history-loading" id="historyLoading" role="status" aria-live="polite" hidden></div>
          <button class="text-button" id="historyRetry" type="button" onclick="loadHistory()" hidden>重试</button>
          <button class="text-button" id="historyMore" type="button" onclick="loadHistory()" hidden>加载更多</button>
          <div class="history-sentinel" id="historySentinel"></div>
        </div>
      </section>
    </main>
    <footer class="page-version">XPut · v1.6.1</footer>
  </div>

  <!-- 删除确认弹窗 -->
  <div class="modal-overlay" id="deleteModal">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="deleteTitle">
      <h3 id="deleteTitle">🗑️ <span data-i18n="deleteConfirmTitle">确认删除</span></h3>
      <p data-i18n="deleteConfirmText">确定要删除这篇存档吗？<br>此操作不可恢复。</p>
      <div class="delete-auth">
        <label for="deletePassword" id="deletePasswordLabel">管理密码</label>
        <input
          id="deletePassword"
          type="password"
          autocomplete="current-password"
          placeholder="输入管理密码"
          aria-describedby="deletePasswordError"
        >
        <div class="delete-password-error" id="deletePasswordError" role="alert" aria-live="polite"></div>
      </div>
      <div class="modal-buttons">
        <button class="btn-cancel" onclick="closeDeleteModal()" data-i18n="cancelBtn">取消</button>
        <button class="btn-delete" onclick="confirmDelete()" data-i18n="deleteBtn">删除</button>
      </div>
    </div>
  </div>

  <script src="/i18n.js?v=1.6.1"></script>
  <script src="/home-state.js?v=1.6.1"></script>
  <script src="/app.js?v=1.6.1"></script>
