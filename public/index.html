<head>
  <meta charset="UTF-8">

  <!-- Open Graph / Facebook -->

  <meta property="og:url" content="https://xput.app/">

  <meta property="og:image" content="https://xput.app/xput-share.png">

  <meta name="twitter:card" content="summary_large_image">

  <!-- JSON-LD 结构化数据 -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "XPut",
    "description": "专业的 X(Twitter) 内容存档工具，可保存推文、图片和视频，生成可访问的镜像页面。",
    "url": "https://xput.app/",
    "applicationCategory": "UtilitiesApplication",
    "operatingSystem": "Any",
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "USD"
    },
    "author": {
      "@type": "Organization",
      "name": "XPut"
    }
  }

  <link rel="stylesheet" href="./theme.css?v=1.9.4">
  <link rel="stylesheet" href="./home.css?v=1.9.4">
  <link rel="stylesheet" href="./style.css?v=1.9.4">
  <!-- Retain the existing analytics site ID to preserve historical reporting across the domain migration. -->
  <script defer data-domain="xmirror.app" src="https://a.zhxs.me/js/script.js"></script>
</head>
<body class="home-page">
  <div class="page-shell">
    <nav class="page-tools" aria-label="页面设置">
      <button class="quiet-button" type="button" onclick="toggleHomeTheme()" aria-label="切换主题" id="themeButton"><span aria-hidden="true">◐</span></button>
      <button class="quiet-button" type="button" onclick="toggleLanguage()" id="lang-btn">EN</button>
    </nav>
    <main>
      <header class="header">
        <a class="brand" href="/" aria-label="XPut 首页"><span class="brand-mark" aria-hidden="true">X</span><strong>XPut</strong></a>
        <div class="header-right"><span>留住值得再读的内容</span><a href="#archiveForm">存档链接 ↗</a></div>
      </header>
      <section class="archive-section" aria-label="生成存档">
        <div class="hero-heading"><div class="hero-brand"><img class="logo-image" src="./xput-logo.svg" alt="" aria-hidden="true"><strong>XPut</strong></div><div class="hero-title"><h1>X 内容存档与分享</h1><p class="home-subtitle">保存 X 上的图文与视频，随时阅读，轻松分享。</p></div></div>
        <form id="archiveForm" novalidate>
          <svg class="archive-link-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.1 0l2-2a5 5 0 0 0-7.1-7.1l-1.1 1.1" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M14 11a5 5 0 0 0-7.1 0l-2 2A5 5 0 0 0 12 20.1l1.1-1.1" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <div class="input-group">
            <label for="url">X 链接</label>
            <input type="url" id="url" placeholder="粘贴 X / Twitter 帖子链接" autocomplete="off" autocapitalize="none" spellcheck="false" aria-describedby="result" required>
          </div>
          <button class="primary-button" id="submit" type="submit">存档</button>
        </form>
        <div class="loading" id="loading" role="status" hidden><span class="spinner" aria-hidden="true"></span><p>正在抓取内容…</p></div>
        <div class="result" id="result" role="status" aria-live="polite" aria-atomic="true" hidden></div>
      </section>
      <aside class="shortcut-card">
        <div class="shortcut-copy">
          <div class="title">iPhone 一键存档快捷指令</div>
          <div class="desc">复制 X 链接后，一键生成 XPut 存档链接</div>
        </div>
        <a class="shortcut-link" href="https://www.icloud.com/shortcuts/e2c41e2726044bc38dc57c8fbd45c734" target="_blank" rel="noopener noreferrer">立即安装 ↗</a>
      </aside>
      <section class="history" id="history" aria-label="存档记录">
        <div class="history-head"><div class="history-tabs" role="tablist" aria-label="存档记录">
          <button id="publicTab" role="tab" type="button" aria-controls="publicPanel" aria-selected="true" onclick="switchHistory('public')">最新公开存档</button>
          <button id="localTab" role="tab" type="button" aria-controls="localPanel" aria-selected="false" tabindex="-1" onclick="switchHistory('local')">本机记录</button>
        </div></div>
        <div id="localPanel" role="tabpanel" aria-labelledby="localTab" tabindex="0" hidden>
          <div id="localHistoryList"></div>
        </div>
        <div id="publicPanel" role="tabpanel" aria-labelledby="publicTab" tabindex="0">
          <div id="historyList"></div>
          <div class="history-feedback">
            <div class="history-loading" id="historyLoading" role="status" aria-live="polite" hidden></div>
            <button class="text-button" id="historyRetry" type="button" onclick="loadHistory()" hidden>请重试</button>
          </div>
          <button class="history-more" id="historyMore" type="button" onclick="loadHistory()" hidden>加载更多</button>
          <div class="history-sentinel" id="historySentinel"></div>
        </div>
      </section>
    </main>
    <footer class="page-version"><span class="footer-brand"><img src="./xput-logo.svg" alt="" aria-hidden="true">XPut · v1.9.4</span><nav class="footer-links" aria-label="网站导航"><a href="/browse" data-i18n="browseLink">浏览公开存档 →</a><a href="/help" data-i18n="helpLink">使用帮助</a><a href="/report" data-i18n="reportLink">投诉／删除申请</a></nav></footer>
  </div>

  <!-- 删除确认弹窗 -->
  <div class="modal-overlay" id="deleteModal">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="deleteTitle">
      <h3 id="deleteTitle">🗑️ <span data-i18n="deleteConfirmTitle">确认删除</span></h3>
      <p data-i18n="deleteConfirmText">确定要删除这篇存档吗？<br>此操作不可恢复。</p>
      <div class="delete-auth">
        <label for="deletePassword" id="deletePasswordLabel">管理密码</label>
        <input
          id="deletePassword"
          type="password"
          autocomplete="current-password"
          placeholder="输入管理密码"
          aria-describedby="deletePasswordError"
        >
        <div class="delete-password-error" id="deletePasswordError" role="alert" aria-live="polite"></div>
      </div>
      <div class="modal-buttons">
        <button class="btn-cancel" onclick="closeDeleteModal()" data-i18n="cancelBtn">取消</button>
        <button class="btn-delete" onclick="confirmDelete()" data-i18n="deleteBtn">删除</button>
      </div>
    </div>
  </div>

  <script src="./seo-events.js?v=1.9.4" defer></script>
  <script src="./i18n.js?v=1.9.4"></script>
  <script src="./home-state.js?v=1.9.4"></script>
  <script src="./app.js?v=1.9.4"></script>
</body>
</html>
