  <rect width="512" height="512" rx="112" fill="url(#background)"/>
  <path d="M132 124 242 256 132 388" fill="none" stroke="#FFFFFF" stroke-width="58" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="m380 124-110 132 110 132" fill="none" stroke="url(#reflection)" stroke-width="58" stroke-linecap="round" stroke-linejoin="round"/>
