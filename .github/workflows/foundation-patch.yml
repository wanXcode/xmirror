name: Apply foundation patch

on:
  push:
    branches:
      - chore/v1.6-foundation

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/v1.6-foundation
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Patch server security and permissions
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'server.js';
          let source = fs.readFileSync(file, 'utf8');

          function replaceOnce(from, to, label) {
            if (!source.includes(from)) throw new Error(`missing patch anchor: ${label}`);
            source = source.replace(from, to);
          }

          replaceOnce(
            "const { normalizePublicBaseUrl, buildPublicUrl } = require('./lib/public-url');",
            "const { normalizePublicBaseUrl, buildPublicUrl } = require('./lib/public-url');\nconst { createAdminGuard } = require('./lib/admin-auth');",
            'admin auth import'
          );

          replaceOnce(
            "const MODERATION_ADMIN_TOKEN = process.env.MODERATION_ADMIN_TOKEN || '';",
            "const MODERATION_ADMIN_TOKEN = process.env.MODERATION_ADMIN_TOKEN || '';\nconst requireAdmin = createAdminGuard(MODERATION_ADMIN_TOKEN);",
            'admin guard initialization'
          );

          replaceOnce(
            "for (const dir of [DATA_DIR, ARCHIVES_DIR, path.join(DATA_DIR, 'images'), path.join(DATA_DIR, 'videos')]) {\n  try { fs.chmodSync(dir, 0o777); } catch {}\n}",
            "for (const dir of [DATA_DIR, ARCHIVES_DIR, path.join(DATA_DIR, 'images'), path.join(DATA_DIR, 'videos')]) {\n  try { fs.chmodSync(dir, 0o750); } catch {}\n}",
            'directory permissions'
          );

          replaceOnce(
            "if (fs.existsSync(dbPath)) {\n  try { fs.chmodSync(dbPath, 0o666); } catch {}\n}",
            "if (fs.existsSync(dbPath)) {\n  try { fs.chmodSync(dbPath, 0o640); } catch {}\n}",
            'database permissions'
          );

          replaceOnce(
            "function healDbWriteability() {\n  try { fs.chmodSync(DATA_DIR, 0o777); } catch {}\n  try { fs.chmodSync(dbPath, 0o666); } catch {}\n  try { db.run('PRAGMA query_only = OFF'); } catch {}\n}",
            "function healDbWriteability() {\n  try { fs.chmodSync(DATA_DIR, 0o750); } catch {}\n  try { fs.chmodSync(dbPath, 0o640); } catch {}\n  try { db.run('PRAGMA query_only = OFF'); } catch {}\n}",
            'writeability repair permissions'
          );

          replaceOnce(
            "function requireAdmin(req, res, next) {\n  if (!MODERATION_ADMIN_TOKEN) {\n    return res.status(503).json({ error: '后台未配置 MODERATION_ADMIN_TOKEN' });\n  }\n\n  const token = req.get('x-admin-token') || req.query.token || req.body?.token;\n  if (token !== MODERATION_ADMIN_TOKEN) {\n    return res.status(403).json({ error: '无权限访问后台' });\n  }\n\n  return next();\n}\n\n",
            "",
            'legacy admin guard'
          );

          replaceOnce(
            "app.post('/api/delete', async (req, res) => {",
            "app.post('/api/delete', requireAdmin, async (req, res) => {",
            'delete authorization'
          );

          fs.writeFileSync(file, source);
          NODE

      - name: Remove runtime state from Git tracking
        run: |
          git rm -r --cached --ignore-unmatch data archives node_modules
          git rm --cached --ignore-unmatch server.log

      - name: Remove one-shot workflow
        run: git rm .github/workflows/foundation-patch.yml

      - name: Verify
        run: |
          npm ci
          npm test
          node --check server.js

      - name: Commit foundation changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js
          git commit -m "security: harden admin operations and clean runtime state"
          git push origin HEAD:chore/v1.6-foundation
